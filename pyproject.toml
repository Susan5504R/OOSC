[project]
name = "crucible"
version = "0.1.0"
description = "Agent evaluation and reliability engine - CI for autonomous agents"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.9,<3", "typer>=0.12,<0.17", "rich>=13.7"]

[project.optional-dependencies]
live = ["google-genai>=2.0,<3", "fastapi>=0.115", "uvicorn>=0.31"]
dev = ["pytest>=8.0"]

[project.scripts]
crucible = "crucible.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crucible*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
